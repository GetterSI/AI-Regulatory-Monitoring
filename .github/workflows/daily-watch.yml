name: Daily Regulatory Watch

on:
  schedule:
    # 8am UTC. GitHub Actions cron always runs in UTC - adjust this hour to match 8am in YOUR local timezone.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python monitor.py

      - name: Commit updated snapshots and run log
        run: |
          git config user.name "cloud-regulatory-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots.json runs.json
          git diff --quiet --cached || git commit -m "Daily watch run"
          git push
