name: Daily Regulatory Watch

on:
  schedule:
    # 8am UTC. GitHub Actions cron always runs in UTC — adjust this hour to
    # match 8am in YOUR local timezone. Examples:
    #   UK/Ireland (BST, UTC+1, summer):        "0 7 * * *"
    #   UK/Ireland (GMT, UTC+0, winter):        "0 8 * * *"
    #   US Eastern (EDT, UTC-4, summer):        "0 12 * * *"
    #   US Eastern (EST, UTC-5, winter):        "0 13 * * *"
    #   US Central (UTC-5/-6):                  "0 13 * * *" or "0 14 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write   # needed so the workflow can commit updated snapshots/runs back
  issues: write     # needed so the workflow can open an issue when it finds a change

jobs:
  watch:
    runs-on: ubuntu-latest
    services:
      # FlareSolverr — free, open-source, no account or API key needed. Runs
      # a stealth-patched Chromium purpose-built to solve Cloudflare-style JS
      # challenges ("just a moment", "one moment, please", etc.). monitor.py
      # only calls it as a last resort, after a plain request and a generic
      # Playwright fetch have both already failed.
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (Chromium)
        # Headless-browser fallback for pages that block plain HTTP requests.
        # --with-deps also installs the OS-level libraries Chromium needs on
        # the bare Ubuntu runner. This only installs Chromium (not the other
        # Playwright browsers), keeping the step reasonably fast.
        run: playwright install --with-deps chromium

      - name: Wait for FlareSolverr to be ready
        # The service container starts fast, but FlareSolverr itself takes a
        # few seconds to bring up Xvfb + Chromium internally before its API
        # will actually answer requests — poll its health endpoint rather
        # than assume it's ready. If it never comes up, don't fail the whole
        # run over it: monitor.py treats FlareSolverr as optional and simply
        # falls through to reporting affected pages as gaps, same as before
        # this existed.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8191/health > /dev/null; then
              echo "FlareSolverr is ready."
              exit 0
            fi
            echo "Waiting for FlareSolverr... ($i/30)"
            sleep 2
          done
          echo "FlareSolverr did not become ready in time — continuing anyway."

      - name: Run monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: python monitor.py

      - name: Commit updated snapshots, run log and dashboard
        run: |
          git config user.name "cloud-regulatory-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots.json runs.json DASHBOARD.md
          git diff --quiet --cached || git commit -m "Daily watch run: $(date -u +%Y-%m-%d)"
          git push
