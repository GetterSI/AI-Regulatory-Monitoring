name: Daily Regulatory Watch

on:
  schedule:
    # 8am UTC. GitHub Actions cron always runs in UTC — adjust this hour to
    # match 8am in YOUR local timezone. Examples:
    #   UK/Ireland (BST, UTC+1, summer):        "0 7 * * *"
    #   UK/Ireland (GMT, UTC+0, winter):        "0 8 * * *"
    #   US Eastern (EDT, UTC-4, summer):        "0 12 * * *"
    #   US Eastern (EST, UTC-5, winter):        "0 13 * * *"
    #   US Central (UTC-5/-6):                  "0 13 * * *" or "0 14 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write   # needed so the workflow can commit updated snapshots/runs back
  issues: write     # needed so the workflow can open an issue when it finds a change

jobs:
  watch:
    runs-on: ubuntu-latest
    services:
      # FlareSolverr — free, open-source, no account or API key needed. Runs
      # a stealth-patched Chromium purpose-built to solve Cloudflare-style JS
      # challenges ("just a moment", "one moment, please", etc.). monitor.py
      # only calls it as a last resort, after a plain request and a generic
      # Playwright fetch have both already failed.
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (Chromium)
        # Headless-browser fallback for pages that block plain HTTP requests.
        # --with-deps also installs the OS-level libraries Chromium needs on
        # the bare Ubuntu runner. This only installs Chromium (not the other
        # Playwright browsers), keeping the step reasonably fast.
        run: playwright install --with-deps chromium

      - name: Wait for FlareSolverr to actually serve /v1
        # CHANGED 2026-09-08. This step used to poll GET /health and stop
        # there. That was the wrong gate: /health answers as soon as
        # FlareSolverr's HTTP server is listening, which happens well before
        # Xvfb + Chromium are up inside the container. /v1 is the endpoint
        # monitor.py actually calls, and it needs the browser. So the old
        # gate could pass while /v1 still could not serve — and the first
        # real page then paid browser-startup time on top of its own 60s
        # maxTimeout, against monitor.py's 70s read ceiling, surfacing as
        # "flaresolverr unreachable: timed out".
        #
        # Now: prove /v1 can execute a real command before the run starts.
        # This doubles as a warm-up, so the first watched page is not the
        # one that pays Chromium's cold start.
        #
        # Deliberately never fails the job. monitor.py treats FlareSolverr as
        # optional and falls through to reporting gaps, exactly as it did
        # before this container existed. A broken sidecar should degrade the
        # run, not cancel it.
        run: |
          set +e

          echo "Stage 1 — transport up? (GET /health)"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8191/health > /dev/null; then
              echo "  /health answered after ~$((i*2))s"
              break
            fi
            sleep 2
          done

          echo "Stage 2 — can /v1 execute a command? (this is the real gate)"
          START=$(date +%s)
          for i in $(seq 1 20); do
            RESP=$(curl -s -m 60 -X POST http://localhost:8191/v1 \
              -H 'Content-Type: application/json' \
              -d '{"cmd":"request.get","url":"https://example.com","maxTimeout":45000}')
            if echo "$RESP" | grep -q '"status":[[:space:]]*"ok"'; then
              echo "  /v1 served a real request after $(( $(date +%s) - START ))s (attempt $i)."
              echo "  FlareSolverr is genuinely ready and warmed up."
              exit 0
            fi
            echo "  attempt $i: /v1 not serving yet — response head: $(echo "$RESP" | head -c 200)"
            sleep 5
          done

          echo "WARNING: /v1 never served a request in ~$(( $(date +%s) - START ))s."
          echo "Pages that need FlareSolverr will be reported as gaps this run."
          exit 0

      - name: Probe the two standing gap URLs (diagnostic only, never fails)
        # ADDED 2026-09-08, temporary. Rows 42 and 193 have been the only two
        # gaps for several runs. They were recorded on 2026-09-07 as "a
        # GitHub Actions outbound-IP block", but that was never actually
        # established — and row 193 returned a real "not found" page to this
        # same runner on 09-07, which a blocked IP would not do.
        #
        # This step settles it with evidence instead of inference. It reports,
        # per URL: whether the runner reaches the site directly at all
        # (HTTP status + wall time), and what FlareSolverr makes of it. Read
        # the step log after the run, then delete this step.
        run: |
          set +e
          probe () {
            label="$1"; url="$2"
            echo "================ $label"
            echo "--- direct curl, 15s cap, follow redirects"
            curl -sL -o /dev/null \
              -w "  http_code=%{http_code}  time_total=%{time_total}s  size=%{size_download}B\n" \
              -m 15 "$url"
            echo "--- via FlareSolverr, 90s cap"
            START=$(date +%s)
            RESP=$(curl -s -m 90 -X POST http://localhost:8191/v1 \
              -H 'Content-Type: application/json' \
              -d "{\"cmd\":\"request.get\",\"url\":\"$url\",\"maxTimeout\":60000}")
            echo "  elapsed=$(( $(date +%s) - START ))s"
            echo "  response head: $(echo "$RESP" | head -c 400)"
            echo
          }

          probe "row 193 — gesetze-im-internet.de (VerpackG)" \
            "https://www.gesetze-im-internet.de/verpackg/BJNR223410017.html"

          probe "row 42 — ecommunity-erp.co.il" \
            "https://www.ecommunity-erp.co.il/%d7%99%d7%a6%d7%a8%d7%a0%d7%99%d7%9d-%d7%95%d7%99%d7%91%d7%95%d7%90%d7%a0%d7%99%d7%9d/%d7%98%d7%91%d7%9c%d7%aa-%d7%93%d7%9e%d7%99-%d7%98%d7%99%d7%a4%d7%95%d7%9c/"

          echo "Diagnostic complete. This step cannot fail the run."
          exit 0

      - name: Run monitor
        # CHANGED 2026-09-08. Piped through tee so the log survives as a file.
        # Run 34217747212 failed in this step after 33m 58s, and the traceback
        # was unreadable: GitHub's log viewer renders only ~49 lines of a step
        # this long, the raw-log zip endpoint 404s, and the log search box did
        # not work. Losing 38 minutes and still not knowing the cause is not
        # acceptable for something this important.
        #
        # pipefail matters: without it the exit status of the pipeline is
        # tee's, which is always 0, and a crashed monitor would look like a
        # clean run. That is exactly the class of silent failure this whole
        # system exists to avoid.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: |
          set -o pipefail
          python monitor.py 2>&1 | tee /tmp/monitor.log

      - name: Show the traceback if the monitor failed
        # Runs only on failure. Writes the tail of the log into the run's own
        # summary page, which renders as Markdown on the run and needs no log
        # viewer at all.
        if: failure()
        run: |
          {
            echo "## Monitor failed — last 120 lines"
            echo
            echo '```'
            tail -n 120 /tmp/monitor.log 2>/dev/null || echo "(no /tmp/monitor.log was produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated snapshots, run log and dashboard
        # CHANGED 2026-09-08, two failure modes fixed.
        #
        # 1. if: always(). Previously this step was skipped whenever the
        #    monitor errored, so run 34217747212 opened an issue for 30
        #    changed pages and then discarded every snapshot behind it. The
        #    next run would then re-detect the same 30. A run must never
        #    alert and then throw away the state the alert was based on.
        #    monitor.py writes snapshots.json and runs.json before it builds
        #    the dashboard, so a late crash still leaves valid files worth
        #    committing; an early crash leaves them untouched and the
        #    git diff check below simply finds nothing to commit.
        #
        # 2. A non-fast-forward push. If anything lands on main during the
        #    ~38 minutes a run takes, the old plain `git push` was rejected
        #    and the run's state was lost. These three files are generated
        #    artefacts, never hand-edited, so the run's own output always
        #    wins: reset onto the current origin/main, restore the generated
        #    files over it, then commit. That cannot produce a merge
        #    conflict, which a rebase of a 2MB JSON file certainly could.
        if: always()
        run: |
          set -e
          if [ ! -f snapshots.json ] && [ ! -f runs.json ] && [ ! -f DASHBOARD.md ]; then
            echo "Nothing generated this run — nothing to commit."
            exit 0
          fi

          mkdir -p /tmp/generated
          for f in snapshots.json runs.json DASHBOARD.md; do
            [ -f "$f" ] && cp "$f" /tmp/generated/
          done

          git config user.name "cloud-regulatory-watch-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/generated/* . 2>/dev/null || true
            git add snapshots.json runs.json DASHBOARD.md 2>/dev/null || true
            if git diff --quiet --cached; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "Daily watch run: $(date -u +%Y-%m-%d)"
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — refetching and retrying."
            sleep 5
          done

          echo "::error::Could not push the run's snapshots after 3 attempts. The run's state was NOT saved."
          exit 1
