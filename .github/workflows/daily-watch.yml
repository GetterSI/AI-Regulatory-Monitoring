name: Daily Regulatory Watch

on:
  schedule:
    # 8am UTC. GitHub Actions cron always runs in UTC — adjust this hour to
    # match 8am in YOUR local timezone. Examples:
    #   UK/Ireland (BST, UTC+1, summer):        "0 7 * * *"
    #   UK/Ireland (GMT, UTC+0, winter):        "0 8 * * *"
    #   US Eastern (EDT, UTC-4, summer):        "0 12 * * *"
    #   US Eastern (EST, UTC-5, winter):        "0 13 * * *"
    #   US Central (UTC-5/-6):                  "0 13 * * *" or "0 14 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write   # needed so the workflow can commit updated snapshots/runs back
  issues: write     # needed so the workflow can open an issue when it finds a change

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (Chromium)
        # Headless-browser fallback for pages that block plain HTTP requests.
        # --with-deps also installs the OS-level libraries Chromium needs on
        # the bare Ubuntu runner. This only installs Chromium (not the other
        # Playwright browsers), keeping the step reasonably fast.
        run: playwright install --with-deps chromium


      - name: Run monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python monitor.py

      - name: Commit updated snapshots, run log and dashboard
        run: |
          git config user.name "cloud-regulatory-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots.json runs.json DASHBOARD.md
          git diff --quiet --cached || git commit -m "Daily watch run: $(date -u +%Y-%m-%d)"
          git push
